    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-color: #F3F4F6;
        --panel-bg: rgba(255, 255, 255, 0.6);
        --border-color: rgba(0, 0, 0, 0.08);
        --text-primary: #1F2937;
        --text-secondary: #4B5563;
        --text-tertiary: #6B7280;
      }
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-primary);
      }
      body {
        overscroll-behavior: contain;
        -webkit-tap-highlight-color: transparent;
      }
      .glass-panel {
        background: var(--panel-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        border-radius: 1rem;
        box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      }
      .aurora {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        background-position: center;
        background-size: 200% 200%;
        transition: opacity 1.5s ease-in-out;
        mix-blend-mode: multiply;
        opacity: 0;
      }
      .aurora-idle {
         background-image: radial-gradient(ellipse at 10% 20%, rgba(129, 140, 248, 0.4), transparent 50%),
                           radial-gradient(ellipse at 90% 10%, rgba(56, 189, 248, 0.4), transparent 50%);
      }
      .aurora-loading {
         background-image: radial-gradient(ellipse at 50% 50%, rgba(79, 70, 229, 0.5), transparent 70%),
                           radial-gradient(ellipse at 20% 90%, rgba(129, 140, 248, 0.3), transparent 70%);
         animation: pulse-aurora 6s infinite ease-in-out;
      }
       .aurora-complete {
         background-image: radial-gradient(ellipse at 80% 80%, rgba(52, 211, 153, 0.5), transparent 60%),
                           radial-gradient(ellipse at 20% 10%, rgba(96, 165, 250, 0.4), transparent 60%);
      }
      .aurora-error {
         background-image: radial-gradient(ellipse at 50% 50%, rgba(239, 68, 68, 0.4), transparent 60%);
      }

      @keyframes pulse-aurora {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes slide-in-left {
        from {
            opacity: 0;
            transform: translateX(-20px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Source Code Pro', 'monospace'],

            colors: {
              'text-primary': 'var(--text-primary)',
              'text-secondary': 'var(--text-secondary)',
              'text-tertiary': 'var(--text-tertiary)',
            },
            keyframes: {
              'pulse-glow': {
                '0%, 100%': { 
                  boxShadow: '0 0 0 0 rgba(129, 140, 248, 0.5)',
                  transform: 'scale(1)',
                 },
                '50%': { 
                  boxShadow: '0 0 0 10px rgba(129, 140, 248, 0)',
                  transform: 'scale(1.05)',
                 },
              },
              'fade-in-up': {
                '0%': {
                  opacity: '0',
                  transform: 'translateY(20px) scale(0.98)'
                },
                '100%': {
                  opacity: '1',
                  transform: 'translateY(0) scale(1)'
                }
              }
            },
            animation: {
              'pulse-glow': 'pulse-glow 2.5s infinite cubic-bezier(0.4, 0, 0.6, 1)',
              'fade-in-up': 'fade-in-up 0.5s cubic-bezier(0.215, 0.610, 0.355, 1) forwards',
            }
          },
        },
      }
    </script>
